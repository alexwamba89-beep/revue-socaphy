<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOCAphy - Fiche du travail</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--vert-900:#052E1A;--vert-800:#0A4A2A;--vert-700:#0B6B3A;--vert-500:#2E8B57;--vert-100:#DDEDE3;--vert-050:#F4F8F5;
--or-700:#8A6E10;--or-500:#C9A227;--or-050:#FBF6E7;--encre:#1A2620;--gris-600:#6A776F;--gris-400:#9AA69E;--filet:#ECEFEC;--papier:#FFFFFF;--brume:#FAFBFA;
--titre:"Fraunces",Georgia,serif;--texte:"Inter",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--max:1060px;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--texte);color:var(--encre);background:var(--papier);font-size:16px;line-height:1.6}
h1,h2,h3{font-family:var(--titre);font-weight:600;line-height:1.2}
a{color:inherit;text-decoration:none}
.wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
.mklogo{height:1.6em;width:auto;vertical-align:-.42em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:10px;background:var(--vert-700);color:#fff;font-weight:500;font-size:15px;border:none;cursor:pointer;width:100%}
.btn:hover{background:var(--vert-900)}
.btn.creux{background:transparent;color:var(--vert-700);border:1px solid var(--filet)}
.btn.creux:hover{background:var(--vert-050)}
header{border-bottom:1px solid var(--filet)}
.nav{display:flex;align-items:center;justify-content:space-between;height:66px}
.logo{font-family:var(--titre);font-size:19px;color:var(--vert-900);display:flex;align-items:center;gap:9px}
.nav ul{display:flex;gap:22px;list-style:none;font-size:15px;color:var(--gris-600)}.nav ul a:hover{color:var(--vert-700)}
@media(max-width:760px){.nav ul{display:none}}
footer{border-top:1px solid var(--filet);padding:34px 0;color:var(--gris-400);font-size:14px;text-align:center;margin-top:24px}
footer a{color:var(--gris-600)}footer a:hover{color:var(--vert-700)}
.charge{padding:80px 24px;text-align:center;color:var(--gris-400)}

.fil{font-size:13px;color:var(--gris-400);padding:22px 0 4px}.fil a:hover{color:var(--vert-700)}
.corps{display:grid;grid-template-columns:1fr 300px;gap:40px;padding:14px 0 50px;align-items:start}
@media(max-width:880px){.corps{grid-template-columns:1fr}}
.type{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--vert-700)}
.tete .an{color:var(--gris-400);font-size:13.5px;margin-left:10px}
.tete h1{font-size:clamp(24px,3.4vw,34px);color:var(--vert-900);font-weight:500;margin:10px 0 12px;line-height:1.25}
.tete .aut{font-size:16px}.tete .inst{color:var(--gris-400);font-size:14.5px;font-style:italic;margin-top:2px}
.bloc{margin-top:32px}.bloc h2{font-family:var(--titre);font-size:20px;color:var(--vert-900);margin-bottom:14px;font-weight:500}
.resume{color:var(--gris-600);font-weight:300;font-size:16px}
.mots{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.mot{font-size:13px;color:var(--vert-700);background:var(--vert-050);padding:4px 12px;border-radius:999px}
.acteurs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.acteur{display:flex;gap:12px;align-items:center;border:1px solid var(--filet);border-radius:12px;padding:14px}
.ava{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--vert-700),var(--vert-500));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0}
.acteur .n{font-size:15px;font-weight:500}.acteur .r{font-size:13px;color:var(--gris-400)}
.side{position:sticky;top:20px;border:1px solid var(--filet);border-radius:16px;padding:22px}
.side .btn{margin-bottom:10px}.side ul{list-style:none;margin-top:14px;border-top:1px solid var(--filet);padding-top:14px;display:grid;gap:11px}
.side li{display:flex;justify-content:space-between;font-size:14px;color:var(--gris-600)}.side li b{color:var(--encre);font-weight:500}
.side .cite{margin-top:14px;border-top:1px solid var(--filet);padding-top:12px;font-size:12.5px;color:var(--gris-400);font-style:italic}
</style></head><body>

<header><div class="wrap nav">
  <a class="logo" href="index.html"><img src="socaphy-logo.png" class="mklogo" alt=""> SOCAphy <span style="color:var(--gris-400);font-weight:400">&middot; Revue</span></a>
  <ul><li><a href="index.html">Dépôt</a></li><li><a href="revue-soumettre.html">Soumettre</a></li><li><a href="https://socaphy.org">Site principal</a></li></ul>
</div></header>

<div class="wrap"><div id="vue"><div class="charge">Chargement…</div></div></div>

<footer><div class="wrap"><a href="https://socaphy.org">Site principal</a> &nbsp;&middot;&nbsp; <a href="index.html">Revue</a></div></footer>

<script>
(function(){
  const SB=window.supabase.createClient("https://sbcgnerfguafogdfqlxb.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNiY2duZXJmZ3VhZm9nZGZxbHhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3OTM5MjAsImV4cCI6MjEwMTM2OTkyMH0.kRV-VnBX1sJuEHqCkMe0YCIz3JnixRJqGHYTrQCdIDg");
  const echap=v=>(v==null?"":String(v)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const TYPES={these:"These de doctorat",memoire:"Memoire de master",article:"Article scientifique",projet:"Projet"};
  const id=new URLSearchParams(location.search).get("id");
  const vue=document.getElementById("vue");
  function initiales(n){var p=String(n||"").trim().split(/[\s.]+/).filter(Boolean);return ((p[0]||"")[0]||"")+((p[1]||"")[0]||"");}
  if(!id){ vue.innerHTML='<div class="charge">Aucun travail selectionne. <a href="index.html" style="color:var(--vert-700)">Retour au depot</a></div>'; return; }
  SB.from("travaux").select("*").eq("id",id).single().then(function(r){
    if(r.error||!r.data){ vue.innerHTML='<div class="charge">Travail introuvable. <a href="index.html" style="color:var(--vert-700)">Retour au depot</a></div>'; return; }
    var t=r.data;
    var mots=(t.mots_cles||[]).map(m=>`<span class="mot">${echap(m)}</span>`).join("");
    var acteurs=String(t.auteurs||"").split(",").map(a=>a.trim()).filter(Boolean).map(a=>`<div class="acteur"><div class="ava">${echap(initiales(a).toUpperCase())}</div><div><div class="n">${echap(a)}</div><div class="r">Auteur</div></div></div>`).join("");
    if(t.directeur) acteurs+=`<div class="acteur"><div class="ava">${echap(initiales(t.directeur).toUpperCase())}</div><div><div class="n">${echap(t.directeur)}</div><div class="r">Directeur / encadrant</div></div></div>`;
    if(t.institution) acteurs+=`<div class="acteur"><div class="ava">${echap(initiales(t.institution).toUpperCase())}</div><div><div class="n">${echap(t.institution)}</div><div class="r">Institution</div></div></div>`;
    var pdf=t.pdf_url?`<a href="${echap(t.pdf_url)}" target="_blank" rel="noopener" class="btn">&#128196; Voir le PDF</a><a href="${echap(t.pdf_url)}" target="_blank" rel="noopener" class="btn creux">Telecharger</a>`:'<div style="color:var(--gris-400);font-size:14px">PDF non disponible</div>';
    vue.innerHTML=`
      <div class="fil"><a href="index.html">Dépôt</a> &rsaquo; <span style="color:var(--gris-600)">${echap(t.titre)}</span></div>
      <div class="corps">
        <article>
          <div class="tete"><span class="type">${echap(TYPES[t.type]||"Travail")}</span><span class="an">${echap(t.annee)}</span>
            <h1>${echap(t.titre)}</h1><div class="aut">${echap(t.auteurs)}</div><div class="inst">${echap(t.institution)}</div></div>
          <div class="bloc"><h2>Résumé</h2><p class="resume">${echap(t.resume)}</p><div class="mots">${mots}</div></div>
          <div class="bloc"><h2>Acteurs principaux</h2><div class="acteurs">${acteurs||"<p>-</p>"}</div></div>
        </article>
        <aside class="side">
          ${pdf}
          <ul><li><span>Type</span><b>${echap(TYPES[t.type]||"-")}</b></li><li><span>Année</span><b>${echap(t.annee)}</b></li><li><span>Domaine</span><b>${echap(t.domaine||"-")}</b></li><li><span>Langue</span><b>Français</b></li></ul>
          <div class="cite">${echap(t.auteurs)} (${echap(t.annee)}). ${echap(t.titre)}. ${echap(t.institution)}. SOCAphy.</div>
        </aside>
      </div>`;
    document.title="SOCAphy - "+(t.titre||"Fiche");
  });
})();
</script>
</body></html>
